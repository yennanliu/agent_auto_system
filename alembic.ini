# Only for AUTHORING revisions with the CLI, e.g.
#   uv run alembic revision --autogenerate -m "add run.notified_at"
# The app never reads this file: migrations run on startup from
# src/migrations/__init__.py, configured in code (see doc/dev-notes.md).
[alembic]
script_location = %(here)s/src/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
