name: Daily new jobs

# Scrapes today's SWE / backend / full-stack / AI / FDE postings from big-tech and
# top-AI companies' official careers boards (scripts/daily_new_jobs.py) and commits
# report/YYYYMMDD/new_job.txt back to main.
#
# A scheduled run reports the *previous* UTC day. GitHub cron is best-effort and can fire
# hours late (the first run was 4h40m late), so "today at run time" drifted into the next
# day and produced a near-empty report under the wrong date. Reporting yesterday makes the
# delay harmless; the off-the-hour minute dodges the top-of-hour queue. Manual runs default
# to today (UTC), or take an explicit date.

on:
  schedule:
    - cron: "17 0 * * *"    # 00:17 UTC = 08:17 Asia/Taipei; reports the UTC day just ended
  workflow_dispatch:
    inputs:
      date:
        description: "Report date YYYY-MM-DD (blank = today UTC; scheduled runs use yesterday)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-new-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape the day's new jobs   # stdlib only, no install step
        env:
          INPUT_DATE: ${{ inputs.date }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_DATE" ]; then day="$INPUT_DATE"
          elif [ "$EVENT" = "schedule" ]; then day="$(date -u -d yesterday +%F)"
          else day="$(date -u +%F)"; fi
          echo "REPORT_DATE=$day" >> "$GITHUB_ENV"
          python scripts/daily_new_jobs.py --date "$day"

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "report: new jobs ${REPORT_DATE}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
