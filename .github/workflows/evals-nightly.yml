name: Evals (nightly)

# Live tier of the eval regression set (doc/evals.md): runs each golden case's LLM
# step from fixtures, scores it with the existing judge, and fails on a quality
# regression against evals/baseline.json. The offline tier needs no keys and runs
# in normal PR CI as tests/unit/test_evalset.py — this workflow is never a PR gate.
#
# Needs at least one provider key as a repository secret (OPENAI_API_KEY /
# GEMINI_API_KEY / ANTHROPIC_API_KEY). Two providers are better: the judge must be
# a different model from the one under test. With no secret set, the job prints a
# notice and exits green.

on:
  schedule:
    - cron: "17 19 * * *"   # 03:17 Asia/Taipei
  workflow_dispatch:
    inputs:
      provider:
        description: "Run provider (openai / gemini / anthropic). Blank = first with a key."
        required: false
        default: ""
      model:
        description: "Run model. Blank = the provider's default."
        required: false
        default: ""
      only:
        description: "Limit to one job type or job_type/case_id. Blank = all cases."
        required: false
        default: ""

permissions:
  contents: read
  issues: write   # the notify step comments on the "Nightly eval status" issue

concurrency:
  group: evals-nightly
  cancel-in-progress: false

jobs:
  live:
    name: Live eval regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Provider API keys are NOT set at job level: they are passed only to the steps
    # that need them (the key check and the live run), so third-party actions never
    # see them. Actions are pinned by full commit SHA.
    env:
      # Optional repository variables; a manual run's inputs win.
      EVAL_RUN_PROVIDER: ${{ inputs.provider || vars.EVAL_RUN_PROVIDER }}
      EVAL_RUN_MODEL: ${{ inputs.model || vars.EVAL_RUN_MODEL }}
      EVAL_JUDGE_PROVIDER: ${{ vars.EVAL_JUDGE_PROVIDER }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
      EVAL_ONLY: ${{ inputs.only }}

    steps:
      - name: Check for provider API keys
        id: keys
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY$GEMINI_API_KEY$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Evals skipped::No provider API key secret is set (OPENAI_API_KEY / GEMINI_API_KEY / ANTHROPIC_API_KEY), so the live eval tier did not run. See doc/evals.md."
            echo "Live eval tier skipped: no provider API key secret is configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.keys.outputs.present == 'true'

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        if: steps.keys.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.keys.outputs.present == 'true'
        run: uv sync --frozen

      - name: Run live evals
        id: live
        if: steps.keys.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args=(--live --report-dir eval-report)
          if [ -n "$EVAL_ONLY" ]; then args+=(--only "$EVAL_ONLY"); fi
          uv run python scripts/run_evals.py "${args[@]}"

      - name: Publish report summary
        if: always() && steps.keys.outputs.present == 'true'
        run: |
          if [ -f eval-report/report.md ]; then cat eval-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report artifact
        if: always() && steps.keys.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-report
          path: eval-report/
          if-no-files-found: warn
          retention-days: 30

      # Every run (skipped, passed, regressed or broken) leaves one comment on the
      # tracking issue, so a silent skip can't hide behind a green check again.
      # GitHub emails everyone watching the issue. Uses only GITHUB_TOKEN.
      - name: Notify (tracking issue comment)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEYS_PRESENT: ${{ steps.keys.outputs.present }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          if [ "$KEYS_PRESENT" != "true" ]; then
            status="⚪ SKIPPED — no provider API key secret, the live tier did not run"
          else
            case "$LIVE_OUTCOME" in
              success)   status="✅ PASSED — no quality regression vs evals/baseline.json" ;;
              failure)   status="❌ FAILED — quality regression or eval error (see report / log)" ;;
              cancelled) status="🟠 CANCELLED" ;;
              *)         status="🟠 ERROR — setup failed before the evals ran" ;;
            esac
          fi
          title="Nightly eval status"
          num=$(gh issue list --state open --label eval-status --json number -q '.[0].number')
          if [ -z "$num" ]; then
            gh label create eval-status --color 5319e7 --description "Nightly eval notifications" 2>/dev/null || true
            url=$(gh issue create --title "$title" --label eval-status \
              --body "Each run of \`.github/workflows/evals-nightly.yml\` comments here. Subscribe to this issue to get the result by email.")
            num=${url##*/}
          fi
          {
            echo "### $status"
            echo
            echo "Run: $RUN_URL  ·  trigger: \`$EVENT\`  ·  ref: \`$REF\`"
            if [ -f eval-report/report.md ]; then
              echo
              echo "<details><summary>Report</summary>"
              echo
              head -c 50000 eval-report/report.md
              echo
              echo "</details>"
            fi
          } > notify.md
          gh issue comment "$num" --body-file notify.md
