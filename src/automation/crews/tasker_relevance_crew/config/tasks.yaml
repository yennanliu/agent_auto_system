judge_relevance_task:
  description: >
    接案者只想投遞符合以下「篩選條件」的案件（這是類別之外的第二道關卡）：
    ---
    {task_filter}
    ---

    請判斷下面這個 tasker.com.tw 案件是否符合上述篩選條件。

    案件標題：{case_title}

    案件內容（節錄）：
    {case_description}

    判斷要求：
    - 篩選條件若是以逗號／頓號列出的技能、領域或案件類型，代表「符合任一項即可」：
      案件只要符合其中至少一項就算相關，不需要全部符合。
    - 傾向投遞：與篩選條件同領域、差一點符合的相近案件（例如條件寫 Python 後端，
      而案件是 Node.js 後端或 API 串接）也算相關 (relevant=true)，除非條件明確排除。
    - 只有案件明顯屬於篩選條件之外的領域，或落在條件明確排除的類型時，才算不相關
      (relevant=false)。條件中明確的排除項永遠優先。
    - reason 用一句簡短繁體中文說明判斷依據（例如「屬於 Python 後端開發，符合條件」或
      「屬於美編設計，已被排除」）。
    - 只輸出一個 JSON 物件，格式為 {{"relevant": true 或 false, "reason": "<一句話>"}}。
      不要輸出任何其他文字、標題、引號外的說明或 Markdown。
  expected_output: >
    一個嚴格的 JSON 物件，例如 {{"relevant": true, "reason": "屬於後端開發，符合條件"}}。
  agent: relevance_judge
