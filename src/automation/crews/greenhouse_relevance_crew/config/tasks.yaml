judge_relevance_task:
  description: >
    The job seeker only wants to apply to jobs matching the following "filter"
    (this is a second gate beyond the keyword search):
    ---
    {task_filter}
    ---

    Decide whether the job below matches the filter above.

    Job title: {job_title}

    Job info (company / location):
    {job_meta}

    Requirements:
    - A list of skills / fields / role types in the filter (e.g. "AI, software,
      backend, python, cloud, infra") means ANY of them: the job is relevant if it
      matches at least ONE item. It does not have to match every item — e.g. a Go
      backend role matches "backend" even if the filter also says "python", and an
      SRE / platform role matches "cloud" or "infra".
    - Lean towards applying: a role that is adjacent to the filter's field (e.g. for
      an engineering filter: full-stack, SRE / platform, data / ML engineering,
      solutions / implementation / forward-deployed engineering) counts as relevant
      (relevant=true) unless the filter explicitly excludes it.
    - It is not relevant (relevant=false) only when the job is clearly in a
      different field (e.g. sales, finance, HR, operations for an engineering
      filter), or falls into a type the filter explicitly excludes. Explicit
      exclusions in the filter always win.
    - reason: one short sentence explaining the call (e.g. "Backend engineer role,
      matches the Python filter" or "Sales role, which is excluded").
    - Output exactly one JSON object: {{"relevant": true or false, "reason": "<one sentence>"}}.
      Do not output any other text, heading, or Markdown.
  expected_output: >
    A strict JSON object, e.g. {{"relevant": true, "reason": "Backend engineer role, matches the filter"}}.
  agent: relevance_judge
