resolve_area_task:
  description: >
    使用者輸入的地區文字如下（可能含中英文、簡稱或錯字）：
    ---
    {raw_input}
    ---

    請將它對應到以下「允許的標準縣市名稱」清單中的一個或多個項目：
    {valid_areas}

    對應要求：
    - 只能從上方允許清單原字挑選，不可自創或改寫名稱。
    - 可對應多個（例如輸入「雙北」對應「台北市」與「新北市」；「北部」可含台北市、新北市、
      基隆市、桃園市、新竹縣市 等）。
    - 若完全無法合理對應，areas 回傳空陣列 []。
    - 只輸出一個 JSON 物件，格式為 {{"areas": ["台北市", "新北市"]}}。
      不要輸出任何其他文字、標題或 Markdown。
  expected_output: >
    一個嚴格的 JSON 物件，例如 {{"areas": ["台北市"]}}。
  agent: area_resolver
