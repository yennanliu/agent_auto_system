judge_relevance_task:
  description: >
    求職者只想投遞符合以下「篩選條件」的職缺（這是關鍵字搜尋之外的第二道關卡）：
    ---
    {task_filter}
    ---

    請判斷下面這個 104.com.tw 職缺是否符合上述篩選條件。

    職缺標題：{job_title}

    職缺資訊（公司／摘要）：
    {job_meta}

    判斷要求：
    - 先判斷這個職缺的「核心工作」是什麼（寫程式／建模型、銷售、行銷、設計、客服、採購、生產、
      教學……），再拿核心工作去對照篩選條件。條件裡的技術或領域詞（例如 AI、Python、雲端、資料）
      指的是「以開發、建置、研究該技術為主要工作」的職缺，不是標題或公司剛好出現這個詞的職缺。
      只是「使用該工具」「販售或行銷該產品」「身處該產業」的職缺不算符合。
      以條件「AI」為例：AI 工程師、LLM／機器學習工程師、資料科學家、AI 研究員相關 (relevant=true)；
      「AI 影音剪輯師」「AI 行銷企劃」「AI 客服訓練專員」「AI 資料標註員」「AI 業務／商務開發」
      「AI 伺服器採購／物控」「AI 產業鏈技術員」「AI 資料中心機構／散熱工程師」「AI 繪圖設計師」
      都不相關 (relevant=false)，因為它們的核心工作是剪輯、行銷、客服、標註、銷售、採購、生產、
      硬體或設計。
    - 篩選條件若是以逗號／頓號列出的技能、領域或職務類型（例如「AI、軟體、後端、Python、雲端」），
      代表「符合任一項即可」：職缺只要符合其中至少一項就算相關，不需要全部符合。
      例如使用 Go 的後端職缺符合「後端」，即使條件也寫了 Python；SRE／平台職缺符合「雲端」或「infra」。
      條件裡的「軟體／software」涵蓋所有以寫程式為主的開發職（前端、後端、全端、App、資料工程），
      不論使用哪種語言或框架。
    - 傾向投遞：核心工作與篩選條件同領域、差一點符合的相近職缺（以工程類條件為例：全端、SRE／平台、
      資料／ML 工程、解決方案／導入／前線部署 (FDE) 工程師）也算相關 (relevant=true)，除非條件明確排除。
      「相近」指的是同一類工作，不是同一個字：技能條件（如 Python）對應的是用它做開發的職缺，
      教這項技能的講師、助教不算。
    - 嚴格條件：條件若寫了「只」「僅」「必須」「only」等限定詞，或同時列出「不要／排除」的類型，
      就不適用上一條的「相近也算」。此時核心工作必須明確落在條件要的類型內才算相關；
      只是相近（例如條件只要 AI／ML 工程職，而職缺是一般後端、前端、全端、系統或 MIS 工程師）
      或拿不準時，一律判不相關 (relevant=false)。
      但被排除的若是「一般」的某類職缺，而這個職缺明確屬於條件要的類型（例如條件只要 AI 工程職、
      不要一般後端，職缺是「AI Agent 後端工程師」），以要的類型為準，算相關。
    - 只有職缺明顯屬於不同領域（例如工程類條件下的業務、財務、人資、行政），或落在條件明確
      排除的類型時，才算不相關 (relevant=false)。條件中明確的排除項永遠優先。
    - reason 用一句簡短繁體中文說明判斷依據（例如「後端工程師職缺，符合 Python 條件」或
      「屬於業務性質，已被排除」）。
    - 只輸出一個 JSON 物件，格式為 {{"relevant": true 或 false, "reason": "<一句話>"}}。
      不要輸出任何其他文字、標題、引號外的說明或 Markdown。
  expected_output: >
    一個嚴格的 JSON 物件，例如 {{"relevant": true, "reason": "後端工程師職缺，符合條件"}}。
  agent: relevance_judge
