id: bakery-landing-zh
job_type: web_scraper
description: >-
  A synthetic Traditional-Chinese small-business landing page. Checks that CJK
  content survives intact (hours, prices, address) and nothing is invented —
  the page has no outbound links, so "links" must be empty.
payload:
  url: "https://example.com/mugi-bakery"
fixtures:
  tools:
    web_scraper:
      url: "https://example.com/mugi-bakery"
      title: "麥禾手作烘焙坊｜範例市天然酵母麵包"
      meta_description: "麥禾手作烘焙坊是一間虛構的社區麵包店，主打天然酵母與在地小麥。"
      headings: ["麥禾手作烘焙坊", "招牌商品", "營業時間", "預訂方式"]
      text: >-
        麥禾手作烘焙坊。我們是位於範例市的社區麵包店，堅持使用天然酵母與在地小麥，每天清晨五點開始手工製作。
        招牌商品：天然酵母鄉村麵包每個180元；桂圓核桃麵包每個220元；鹽可頌每個45元，每日限量120個，通常中午前售完。
        營業時間：週二至週日上午8點至下午6點，每週一公休。
        預訂方式：十個以上的訂單請於三天前來電預訂，電話 02-5550-0100，或直接到店填寫訂購單。
        店址：範例市範例路100號一樓。
      word_count: 9
      links: []
