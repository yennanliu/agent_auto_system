    - "麥禾手作烘焙坊"
    - "天然酵母"
    - "180"
    - "週一公休"
    - "02-5550-0100"
  assertions:
    - {path: "url", equals: "https://example.com/mugi-bakery"}
    - {path: "title", type: str, non_empty: true}
    - {path: "summary", type: str, non_empty: true}
    - {path: "key_points", type: list, min_len: 4, max_len: 6}
    - {path: "headings", type: list, min_len: 3}
    - {path: "links", type: list, max_len: 0}
    - {path: "content", type: str, min_len: 150}
  min_judge_score: 70
