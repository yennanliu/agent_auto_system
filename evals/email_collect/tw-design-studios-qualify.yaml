      reason: "檔期詢問與訂金追蹤可自動化。"
      hook: "婚攝旺季的檔期詢問常在深夜湧入，自動回覆檔期並跟進訂金能少漏掉幾組新人。"
    - company: "木目室內裝修設計（虛構）"
      email: "service@mokume-interior.example"
      website: "https://mokume-interior.example"
      category: "室內設計"
      phone: "02-5550-0113"
      address: "範例市範例路3號"
      region: "範例市"
      maps_url: ""
