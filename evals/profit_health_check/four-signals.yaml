# the fixture CSVs (the offline tier re-computes and compares them) — if you edit a CSV,
# re-derive them; do not hand-edit the numbers.
id: four-signals
job_type: profit_health_check
description: 'Four synthetic SKUs, one per signal: a clear winner, a 假爆品 that sells well below cost-plus, an ad
  that costs more than the profit it leaves, and a SKU with repeated returns (one still 處理中, so it counts as a return
  but not a refund). The ads file has the ''##'' comment row and a trailing 折扣 block. Each flagged SKU must get
  a recommendation.'
