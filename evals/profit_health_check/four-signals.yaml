    type: str
    non_empty: true
  - path: recommendations[*].action
    type: str
    non_empty: true
  - path: recommendations[*].reason
    type: str
    non_empty: true
  - path: action_items
    type: list
    min_len: 1
  - path: validation.ok
    equals: true
  min_judge_score: 70
