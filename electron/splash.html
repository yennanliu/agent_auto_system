<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Agent Auto System</title>
  <style>
    html, body {
      margin: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117; color: #e6e8ee;
      display: flex; align-items: center; justify-content: center;
    }
    .wrap { text-align: center; }
    .title { font-size: 18px; font-weight: 600; letter-spacing: .3px; }
    .sub { margin-top: 8px; font-size: 13px; color: #8b90a0; }
    .spinner {
      margin: 22px auto 0; width: 26px; height: 26px;
      border: 3px solid #2a2f3d; border-top-color: #6c8cff;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">Agent Auto System</div>
    <div class="sub" id="status">Starting engine…</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
